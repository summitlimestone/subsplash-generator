name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Compile check
        run: python -m py_compile service_video.py gui.py
      - name: Ruff
        uses: astral-sh/ruff-action@v4
