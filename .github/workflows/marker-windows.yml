name: Sermon Marker (Windows)

# Builds SermonMarker.exe (marker.py plus a bundled ffmpeg/ffprobe/ffplay)
# and runs its --self-test. On pull requests the exe is uploaded as a
# workflow artifact; on a marker-v* tag it's also attached to a release.
on:
  pull_request:
    paths:
      - marker.py
      - gui.py
      - packaging/build_marker.py
      - .github/workflows/marker-windows.yml
  push:
    tags:
      - "marker-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download ffmpeg (LGPL, shared DLLs)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $bin = (Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffplay.exe | Select-Object -First 1).Directory.FullName
          "FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: python packaging/build_marker.py "$env:FFMPEG_BIN"

      - name: Self-test
        shell: pwsh
        run: |
          $size = [math]::Round((Get-Item dist/SermonMarker.exe).Length / 1MB, 1)
          Write-Host "SermonMarker.exe: $size MB"
          # Run from an empty folder: the exe must work on its own, without
          # this repo's ffmpeg download (or anything else) next to it.
          New-Item -ItemType Directory -Force -Path selftest | Out-Null
          Copy-Item dist/SermonMarker.exe selftest/
          $proc = Start-Process -FilePath selftest/SermonMarker.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest/selftest.log
          if ($proc.ExitCode -ne 0) { throw "self-test failed (exit $($proc.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: SermonMarker
          path: dist/SermonMarker.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/marker-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SermonMarker.exe
          name: Sermon Marker ${{ github.ref_name }}
